name: Update unified sideloading repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build merged feeds
        run: python build.py

      - name: Set canonical feed URLs
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json
          import os
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          for path in ("esign.json", "repo.json"):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              data["sourceURL"] = f"https://{owner}.github.io/REPO/{path}"
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\\n")
          PY

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esign.json repo.json
          git diff --cached --quiet || git commit -m "Auto-update unified sideloading feeds"
          git push
