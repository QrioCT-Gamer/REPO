name: Update merged ESign repo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build merged feed
        run: python build.py

      - name: Set public source URL
        run: |
          python - <<'PY'
          import json, os
          p = "esign.json"
          with open(p, encoding="utf-8") as f:
              d = json.load(f)
          owner, name = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          d["sourceURL"] = f"https://{owner}.github.io/{name}/esign.json"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esign.json
          git diff --cached --quiet || git commit -m "Auto-update merged ESign repo"
          git push
